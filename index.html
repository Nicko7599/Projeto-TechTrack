<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5898d4;
      --negativo: #c10015;
      --positivo: #21ba45;
      --sombra: 0 1px 5px rgba(0,0,0,.2), 0 2px 2px rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.12);
      --sombra-dialogo: 0 1px 5px rgba(0,0,0,.2), 0 2px 2px rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 12.5px; color: rgba(0,0,0,.87); background: #fff;
    }
    svg { fill: currentColor; display: block; flex: none; }

    /* ---------- Cabeçalho ---------- */
    header {
      height: 50px; background: var(--primary); color: #fff;
      display: flex; align-items: center; gap: 12px; padding: 0 13px;
      font-size: 17px; font-weight: 700; box-shadow: var(--sombra);
    }
    header svg { width: 22px; height: 22px; }

    main { max-width: 830px; margin: 0 auto; padding: 27px 0 48px; }
    @media (max-width: 860px) { main { padding-left: 16px; padding-right: 16px; } }

    /* ---------- Botões ---------- */
    .btn {
      font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      border: 0; border-radius: 4px; height: 32px; padding: 0 14px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      background: transparent; color: var(--primary); white-space: nowrap;
    }
    .btn:hover { background: rgba(88,152,212,.12); }
    .btn.cheio { background: var(--primary); color: #fff; box-shadow: var(--sombra); }
    .btn.cheio:hover { filter: brightness(.95); }
    .btn.cheio.perigo { background: var(--negativo); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn svg { width: 18px; height: 18px; }
    .btn:focus-visible, .icone:focus-visible { outline: 2px solid rgba(88,152,212,.55); outline-offset: 1px; }

    /* ---------- Barra de busca ---------- */
    .barra { display: flex; gap: 13px; align-items: center; }
    .busca {
      flex: 1; position: relative; height: 33px; border-radius: 4px;
      border: 1px solid rgba(0,0,0,.2); background: #fff; display: flex; align-items: center;
    }
    .busca:hover { border-color: rgba(0,0,0,.87); }
    .busca:focus-within { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    .busca input {
      flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
      font: inherit; font-size: 11.5px; padding: 0 10px; color: rgba(0,0,0,.87);
    }
    .busca input::placeholder { color: rgba(0,0,0,.6); opacity: 1; }
    .busca .limpar {
      border: 0; background: none; padding: 0; margin-right: 9px; cursor: pointer;
      color: rgba(0,0,0,.54); width: 18px; height: 18px; display: none;
    }
    .busca.tem-texto .limpar { display: block; }
    .busca .limpar svg { width: 18px; height: 18px; }

    /* ---------- Tabela ---------- */
    .tabela {
      margin-top: 14px; background: #fff; border-radius: 4px; box-shadow: var(--sombra); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0 14px; text-align: left; white-space: nowrap; }
    th { height: 40px; font-size: 10.5px; font-weight: 700; border-bottom: 1px solid rgba(0,0,0,.12); }
    td { height: 40.5px; font-size: 11px; border-top: 1px solid rgba(0,0,0,.12); }
    tbody tr:first-child td { border-top: 0; }
    tbody tr:hover { background: rgba(0,0,0,.04); }
    th.centro, td.centro { text-align: center; }
    td.vazio { display: table-cell; }
    .vazio-conteudo { display: flex; align-items: center; gap: 8px; }
    .vazio-conteudo svg { width: 20px; height: 20px; }
    tbody tr.sem-dados:hover { background: none; }

    .acoes-linha { display: inline-flex; align-items: center; }
    .icone {
      width: 27px; height: 27px; border: 0; border-radius: 50%; background: none; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(0,0,0,.87);
    }
    .icone:hover { background: rgba(0,0,0,.08); }
    .icone.perigo { color: var(--negativo); }
    .icone svg { width: 20px; height: 20px; }

    /* ---------- Diálogos ---------- */
    .fundo {
      position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center; padding: 16px;
      opacity: 0; transition: opacity .25s ease;
    }
    .fundo.aberto { opacity: 1; }
    .cartao {
      background: #fff; border-radius: 4px; box-shadow: var(--sombra-dialogo);
      width: 320px; max-width: 100%; max-height: 100%; overflow: auto;
      transform: translateY(14px); transition: transform .25s ease;
    }
    .fundo.aberto .cartao { transform: none; }
    .cartao.largo { width: 668px; }
    .conteudo { padding: 15px 13px 13px 14px; }
    .conteudo h2 { margin: 0 0 21px; font-size: 15px; line-height: 20px; font-weight: 700; }
    .conteudo h3 { margin: 0 0 11px; font-size: 15px; line-height: 20px; font-weight: 500; }
    .conteudo p { margin: 0; font-size: 10.8px; line-height: 16px; }
    .acoes { display: flex; justify-content: flex-end; gap: 13px; margin-top: 13px; }

    /* Campos com rótulo flutuante */
    .campo { position: relative; height: 40px; margin-bottom: 20px; }
    .campo.ultimo { margin-bottom: 0; }
    .campo.area { height: 109px; margin-top: 25px; }
    .campo::before, .campo::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    }
    .campo::before { height: 1px; background: rgba(0,0,0,.24); }
    .campo:hover::before { background: rgba(0,0,0,.87); }
    .campo::after {
      height: 2px; background: var(--primary); transform: scaleX(0);
      transition: transform .36s cubic-bezier(.4,0,.2,1);
    }
    .campo:focus-within::after { transform: scaleX(1); }
    .campo input, .campo textarea {
      position: absolute; left: 0; right: 0; width: 100%; border: 0; outline: 0; background: transparent;
      font: inherit; font-size: 12.5px; color: rgba(0,0,0,.87); padding: 0;
    }
    .campo input { top: 14px; height: 20px; line-height: 20px; }
    .campo textarea { top: 14px; bottom: 1px; height: auto; padding-top: 6px; line-height: 17px; resize: vertical; }
    .campo label {
      position: absolute; left: 0; top: 0; height: 36px; display: flex; align-items: center;
      font-size: 13.5px; color: rgba(0,0,0,.6); pointer-events: none; white-space: nowrap;
      transform-origin: left center; transition: transform .3s cubic-bezier(.4,0,.2,1), color .3s;
    }
    .campo.area label { height: 36px; }
    .campo input:focus + label, .campo input:not(:placeholder-shown) + label,
    .campo textarea:focus + label, .campo textarea:not(:placeholder-shown) + label,
    .campo.selecao label {
      transform: translateY(-9px) scale(.75);
    }
    .campo input:focus + label, .campo textarea:focus + label, .campo.selecao.aberta label { color: var(--primary); }
    .campo input:disabled { color: rgba(0,0,0,.38); }
    .campo input:disabled + label { color: rgba(0,0,0,.38); }
    .campo:has(input:disabled):hover::before { background: rgba(0,0,0,.24); }

    /* Seleção (Tipo de operação) */
    .campo.selecao { cursor: pointer; outline: 0; }
    .sel-valor { position: absolute; left: 0; right: 24px; top: 14px; height: 20px; line-height: 20px; font-size: 12.5px; }
    .seta { position: absolute; right: 0; top: 10px; width: 20px; height: 20px; color: rgba(0,0,0,.54); }
    .campo.selecao:focus::after, .campo.selecao.aberta::after { transform: scaleX(1); }
    .menu {
      position: absolute; left: 0; right: 0; top: 40px; z-index: 5; background: #fff; border-radius: 4px;
      box-shadow: var(--sombra); padding: 4px 0; display: none;
    }
    .campo.selecao.aberta .menu { display: block; }
    .menu .item { height: 34px; display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; }
    .menu .item:hover { background: rgba(0,0,0,.06); }
    .menu .item.atual { color: var(--primary); }

    .dica { margin-top: 14px; height: 16px; line-height: 16px; font-size: 11px; color: rgba(0,0,0,.6); }

    /* Histórico */
    .hist-tabela { margin: 0 0 12px; background: #fff; box-shadow: var(--sombra); border-radius: 4px; overflow-x: auto; }
    .hist-tabela table { min-width: 100%; }
    .hist-tabela td, .hist-tabela th { padding: 0 13px; }
    .hist-tabela .acoes { margin-top: 0; }

    /* ---------- Avisos ---------- */
    #avisos {
      position: fixed; left: 50%; bottom: 7px; transform: translateX(-50%); z-index: 3000;
      display: flex; flex-direction: column-reverse; align-items: center; gap: 7px; pointer-events: none;
    }
    .aviso {
      display: flex; align-items: center; gap: 14px; height: 39px; padding: 0 24px 0 14px;
      border-radius: 4px; color: #fff; font-size: 12.5px; box-shadow: var(--sombra);
      opacity: 0; transform: translateY(18px); transition: opacity .3s, transform .3s;
    }
    .aviso.visivel { opacity: 1; transform: none; }
    .aviso svg { width: 22px; height: 22px; }
    .aviso.ok { background: var(--positivo); }
    .aviso.erro { background: var(--negativo); }
  </style>
</head>
<body>

<header>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h18V4H4a2 2 0 0 0-2 2v11H0v3h14v-3H4V6zm19 2h-6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1zm-1 9h-4v-7h4v7z"/></svg>
  TechTrack – Controle de Ativos de TI
</header>

<main>
  <div class="barra">
    <div class="busca" id="busca-caixa">
      <input type="text" id="busca" placeholder="Buscar por Serial Number ou HostName" aria-label="Buscar" autocomplete="off">
      <button type="button" class="limpar" id="busca-limpar" aria-label="Limpar busca">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
      </button>
    </div>
    <button type="button" class="btn cheio" id="btn-novo">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Novo equipamento
    </button>
  </div>

  <div class="tabela">
    <table>
      <thead>
        <tr>
          <th>Serial Number</th>
          <th>HostName</th>
          <th>Colaborador</th>
          <th>Setor</th>
          <th class="centro">Ações</th>
        </tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
  </div>
</main>

<div id="avisos" aria-live="polite"></div>

<script>
  // ---------- Ícones (Material) ----------
  var ICONES = {
    edit: '<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>',
    swap: '<path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>',
    history: '<path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.95 8.95 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>',
    delete: '<path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>',
    check: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>',
    warning: '<path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>',
    seta: '<path d="M7 10l5 5 5-5z"/>'
  };
  function icone(nome) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONES[nome] + '</svg>';
  }
  function esc(texto) {
    return String(texto == null ? "" : texto).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- Comunicação com o programa Python ----------
  async function api(metodo, url, corpo) {
    try {
      var resposta = await fetch(url, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: corpo ? JSON.stringify(corpo) : undefined
      });
      return await resposta.json();
    } catch (erro) {
      return { ok: false, erro: "Não foi possível falar com o TechTrack. O programa (main.py) ainda está aberto?" };
    }
  }

  // ---------- Avisos ----------
  function aviso(texto, tipo) {
    var el = document.createElement("div");
    el.className = "aviso " + tipo;
    el.innerHTML = icone(tipo === "ok" ? "check" : "warning") + "<span>" + esc(texto) + "</span>";
    document.getElementById("avisos").appendChild(el);
    requestAnimationFrame(function () { el.classList.add("visivel"); });
    setTimeout(function () {
      el.classList.remove("visivel");
      setTimeout(function () { el.remove(); }, 300);
    }, 4500);
  }

  // ---------- Estado ----------
  var config = { tipos: [], setor_ti: "TI" };
  var equipamentos = [];
  var corpo = document.getElementById("corpo");

  async function carregar() {
    var termo = document.getElementById("busca").value;
    var r = await api("GET", "/api/equipamentos?busca=" + encodeURIComponent(termo));
    if (!r.ok) { aviso(r.erro, "erro"); return; }
    equipamentos = r.equipamentos;
    desenharTabela();
  }

  function desenharTabela() {
    if (!equipamentos.length) {
      corpo.innerHTML = '<tr class="sem-dados"><td colspan="5"><div class="vazio-conteudo">' +
        icone("warning") + '<span>No data available</span></div></td></tr>';
      return;
    }
    corpo.innerHTML = equipamentos.map(function (e) {
      return '<tr data-id="' + e.id + '">' +
        '<td>' + esc(e.serial_number) + '</td>' +
        '<td>' + esc(e.hostname) + '</td>' +
        '<td>' + esc(e.colaborador) + '</td>' +
        '<td>' + esc(e.setor) + '</td>' +
        '<td class="centro"><span class="acoes-linha">' +
          botaoIcone("editar", "Editar", "edit", e) +
          botaoIcone("movimentar", "Movimentar", "swap", e) +
          botaoIcone("historico", "Histórico", "history", e) +
          botaoIcone("excluir", "Excluir", "delete", e, "perigo") +
        '</span></td></tr>';
    }).join("");
  }

  function botaoIcone(acao, titulo, nome, e, extra) {
    return '<button type="button" class="icone ' + (extra || "") + '" data-acao="' + acao +
      '" title="' + titulo + '" aria-label="' + titulo + ' ' + esc(e.serial_number) + '">' + icone(nome) + '</button>';
  }

  corpo.addEventListener("click", function (ev) {
    var botao = ev.target.closest("button[data-acao]");
    if (!botao) return;
    var id = Number(botao.closest("tr").dataset.id);
    var equip = equipamentos.find(function (e) { return e.id === id; });
    if (!equip) return;
    var acao = botao.dataset.acao;
    if (acao === "editar") dialogoEquipamento(equip);
    else if (acao === "movimentar") dialogoMovimentar(equip);
    else if (acao === "historico") dialogoHistorico(equip);
    else if (acao === "excluir") dialogoExcluir(equip);
  });

  // ---------- Busca ----------
  var campoBusca = document.getElementById("busca");
  var caixaBusca = document.getElementById("busca-caixa");
  var espera;
  campoBusca.addEventListener("input", function () {
    caixaBusca.classList.toggle("tem-texto", campoBusca.value !== "");
    clearTimeout(espera);
    espera = setTimeout(carregar, 250);
  });
  document.getElementById("busca-limpar").addEventListener("click", function () {
    campoBusca.value = "";
    caixaBusca.classList.remove("tem-texto");
    campoBusca.focus();
    carregar();
  });
  document.getElementById("btn-novo").addEventListener("click", function () { dialogoEquipamento(null); });

  // ---------- Diálogos ----------
  function dialogo(html, classe) {
    var fundo = document.createElement("div");
    fundo.className = "fundo";
    fundo.innerHTML = '<div class="cartao ' + (classe || "") + '" role="dialog" aria-modal="true">' + html + "</div>";
    document.body.appendChild(fundo);
    requestAnimationFrame(function () { fundo.classList.add("aberto"); });

    function aoTeclar(ev) { if (ev.key === "Escape") fechar(); }
    function fechar() {
      document.removeEventListener("keydown", aoTeclar);
      fundo.classList.remove("aberto");
      setTimeout(function () { fundo.remove(); }, 220);
    }
    document.addEventListener("keydown", aoTeclar);
    fundo.addEventListener("mousedown", function (ev) { if (ev.target === fundo) fechar(); });
    fundo.querySelectorAll("[data-fechar]").forEach(function (b) { b.addEventListener("click", fechar); });
    return { fundo: fundo, fechar: fechar };
  }

  function campo(rotulo, nome, valor, extra) {
    return '<div class="campo ' + (extra || "") + '"><input name="' + nome + '" value="' + esc(valor || "") +
      '" placeholder=" " autocomplete="off"><label>' + esc(rotulo) + "</label></div>";
  }

  function valores(form) {
    var saida = {};
    new FormData(form).forEach(function (v, k) { saida[k] = v; });
    return saida;
  }

  // Envia o formulário; em caso de erro mostra o aviso vermelho e deixa o diálogo aberto
  function enviar(form, dlg, metodo, url, montarCorpo, mensagemOk) {
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var botao = form.querySelector('button[type="submit"]');
      botao.disabled = true;
      var r = await api(metodo, url, montarCorpo(valores(form)));
      botao.disabled = false;
      if (r.ok) {
        dlg.fechar();
        aviso(mensagemOk, "ok");
        carregar();
      } else {
        aviso(r.erro, "erro");
      }
    });
  }

  function dialogoEquipamento(e) {
    var novo = !e;
    e = e || { serial_number: "", hostname: "", colaborador: "", setor: "" };
    var dlg = dialogo(
      '<form class="conteudo" novalidate>' +
        "<h2>" + (novo ? "Novo equipamento" : "Editar equipamento") + "</h2>" +
        campo("Serial Number *", "serial_number", e.serial_number) +
        campo("HostName", "hostname", e.hostname) +
        campo("Colaborador", "colaborador", e.colaborador) +
        campo("Setor", "setor", e.setor, "ultimo") +
        '<div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button>' +
        '<button type="submit" class="btn cheio">Salvar</button></div></form>'
    );
    var form = dlg.fundo.querySelector("form");
    enviar(form, dlg, novo ? "POST" : "PUT",
      novo ? "/api/equipamentos" : "/api/equipamentos/" + e.id,
      function (v) { return v; },
      novo ? "Equipamento cadastrado." : "Equipamento atualizado.");
    form.querySelector("input").focus();
  }

  function dialogoMovimentar(e) {
    var tipos = config.tipos;
    var itens = tipos.map(function (t, i) {
      return '<div class="item' + (i === 0 ? " atual" : "") + '" data-valor="' + esc(t) + '">' + esc(t) + "</div>";
    }).join("");
    var dlg = dialogo(
      '<form class="conteudo" novalidate>' +
        "<h2>Movimentar " + esc(e.serial_number) + "</h2>" +
        '<div class="campo selecao" tabindex="0">' +
          '<input type="hidden" name="tipo" value="' + esc(tipos[0]) + '">' +
          '<div class="sel-valor">' + esc(tipos[0]) + "</div>" +
          "<label>Tipo de operação *</label>" +
          '<svg class="seta" viewBox="0 0 24 24" aria-hidden="true">' + ICONES.seta + "</svg>" +
          '<div class="menu">' + itens + "</div>" +
        "</div>" +
        campo("Colaborador responsável *", "colaborador", "") +
        campo("Setor de destino *", "setor_destino", "") +
        '<div class="campo area"><textarea name="motivo" placeholder=" "></textarea><label>Motivo</label></div>' +
        campo("Responsável pela operação *", "responsavel_operacao", "", "ultimo") +
        '<div class="dica" hidden>Devolução: o equipamento volta ao setor de ' + esc(config.setor_ti) + ".</div>" +
        '<div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button>' +
        '<button type="submit" class="btn cheio">Registrar</button></div></form>'
    );
    var form = dlg.fundo.querySelector("form");
    var sel = form.querySelector(".selecao");
    var oculto = sel.querySelector("input");
    var dica = form.querySelector(".dica");

    function aplicarTipo() {
      var devolucao = oculto.value === "Devolução";
      ["colaborador", "setor_destino"].forEach(function (nome) {
        var campoEl = form.querySelector('[name="' + nome + '"]');
        campoEl.disabled = devolucao;
        if (devolucao) campoEl.value = "";
      });
      dica.hidden = !devolucao;
    }

    sel.addEventListener("click", function (ev) {
      var item = ev.target.closest(".item");
      if (item) {
        oculto.value = item.dataset.valor;
        sel.querySelector(".sel-valor").textContent = item.dataset.valor;
        sel.querySelectorAll(".item").forEach(function (i) { i.classList.toggle("atual", i === item); });
        sel.classList.remove("aberta");
        aplicarTipo();
      } else {
        sel.classList.toggle("aberta");
      }
    });
    sel.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && sel.classList.contains("aberta")) {
        sel.classList.remove("aberta");
        ev.stopPropagation();
      } else if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        sel.classList.toggle("aberta");
      }
    });
    document.addEventListener("mousedown", function fora(ev) {
      if (!sel.isConnected) { document.removeEventListener("mousedown", fora); return; }
      if (!sel.contains(ev.target)) sel.classList.remove("aberta");
    });

    enviar(form, dlg, "POST", "/api/equipamentos/" + e.id + "/movimentar",
      function (v) {
        return {
          tipo: v.tipo, colaborador: v.colaborador || "", setor_destino: v.setor_destino || "",
          motivo: v.motivo || "", responsavel_operacao: v.responsavel_operacao || ""
        };
      }, "Movimentação registrada.");
  }

  async function dialogoHistorico(e) {
    var r = await api("GET", "/api/equipamentos/" + e.id + "/historico");
    if (!r.ok) { aviso(r.erro, "erro"); return; }
    var miolo;
    if (!r.historico.length) {
      miolo = '<p style="margin-bottom:14px">Nenhuma movimentação registrada.</p>';
    } else {
      var linhas = r.historico.map(function (m) {
        return "<tr>" +
          "<td>" + esc(m.data) + "</td>" +
          "<td>" + esc(m.tipo) + "</td>" +
          "<td>" + esc(m.responsavel_operacao) + "</td>" +
          "<td>" + esc(m.colaborador_anterior || "-") + " / " + esc(m.setor_anterior || "-") + "</td>" +
          "<td>" + esc(m.colaborador_novo || "-") + " / " + esc(m.setor_novo || "-") + "</td>" +
          "<td>" + esc(m.motivo) + "</td></tr>";
      }).join("");
      miolo = '<div class="hist-tabela"><table><thead><tr>' +
        "<th>Data</th><th>Tipo</th><th>Responsável</th>" +
        "<th>Antes (colaborador / setor)</th><th>Depois (colaborador / setor)</th><th>Motivo</th>" +
        "</tr></thead><tbody>" + linhas + "</tbody></table></div>";
    }
    dialogo(
      '<div class="conteudo"><h2 style="margin-bottom:' + (r.historico.length ? 15 : 14) + 'px">Histórico de ' + esc(e.serial_number) + "</h2>" +
      miolo +
      '<div class="acoes" style="margin-top:0"><button type="button" class="btn" data-fechar>Fechar</button></div></div>',
      "largo"
    );
  }

  function dialogoExcluir(e) {
    var dlg = dialogo(
      '<div class="conteudo"><h3>Excluir o equipamento ' + esc(e.serial_number) + "?</h3>" +
      "<p>O histórico de movimentações dele também será apagado.</p>" +
      '<div class="acoes"><button type="button" class="btn" data-fechar>Cancelar</button>' +
      '<button type="button" class="btn cheio perigo" id="confirmar">Excluir</button></div></div>'
    );
    dlg.fundo.querySelector("#confirmar").addEventListener("click", async function () {
      var r = await api("DELETE", "/api/equipamentos/" + e.id);
      if (r.ok) {
        dlg.fechar();
        aviso("Equipamento excluído.", "ok");
        carregar();
      } else {
        aviso(r.erro, "erro");
      }
    });
  }

  // ---------- Início ----------
  (async function () {
    var r = await api("GET", "/api/config");
    if (r.ok) config = r;
    carregar();
  })();
</script>
</body>
</html>
